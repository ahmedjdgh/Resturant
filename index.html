<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- كود إثبات الملكية من جوجل -->
    <meta name="google-site-verification" content="zxAlVM2QSIFzxC6KWysoOlzTgHlm0qWVCDeJX_a6Gl4" />
    
    <title>مجموعة مطاعم السعودي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #faf5ed; color: #333; text-align: center; padding: 20px; }
        
        .container { max-width: 500px; margin: 20px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        
        h2 { color: #8b0032; margin-bottom: 20px; }
        
        /* نظام التقييم */
        .rating-box { margin: 20px 0; }
        .rating-stars { font-size: 3rem; color: #ddd; cursor: pointer; display: flex; gap: 10px; justify-content: center; direction: ltr; }
        .rating-stars span.active { color: #ffb300; }
        
        .rating-emoji { font-size: 3rem; margin: 15px 0; }
        
        .submit-btn { background: #8b0032; color: white; border: none; padding: 12px 30px; border-radius: 50px; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #5a0020; transform: scale(1.05); }
        
        #rating-msg { margin-top: 20px; padding: 15px; border-radius: 10px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>تقييم خدمة مطاعم السعودي</h2>
        <p>رأيك يهمنا لنقدم الأفضل دائماً</p>
        
        <div class="rating-box">
            <div class="rating-stars" id="starContainer">
                <span data-value="1">★</span>
                <span data-value="2">★</span>
                <span data-value="3">★</span>
                <span data-value="4">★</span>
                <span data-value="5">★</span>
            </div>
            <div class="rating-emoji" id="ratingEmoji">😐</div>
            <button class="submit-btn" onclick="submitRating()">إرسال التقييم</button>
            <div id="rating-msg"></div>
        </div>
    </div>

    <script>
        let selectedRating = 0;
        const emojis = ['😞', '🙁', '😐', '😊', '😍'];
        const stars = document.querySelectorAll('.rating-stars span');
        const msgEl = document.getElementById('rating-msg');

        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                selectedRating = index + 1;
                stars.forEach((s, i) => {
                    s.classList.toggle('active', i < selectedRating);
                });
                document.getElementById('ratingEmoji').innerText = emojis[selectedRating - 1];
            });
        });

        function submitRating() {
            if (selectedRating === 0) {
                alert("الرجاء اختيار عدد النجوم أولاً!");
                return;
            }

            const messages = [
                "نأسف جداً لتقصيرنا! سنعمل جاهدين على تحسين خدمتنا لتنال رضاك.",
                "شكراً لملاحظتك، سنقوم بمعالجة القصور وتطوير أدائنا.",
                "شكراً لتقييمك! نسعى دائماً لتقديم تجربة أفضل.",
                "شكراً لك! نحن سعداء بأن الخدمة نالت إعجابك.",
                "ألف شكر! تقييمك الرائع يدفنا للتميز دائماً، نتشرف بخدمتك!"
            ];

            const colors = ["#c62828", "#e65100", "#f57f17", "#2e7d32", "#1b5e20"];
            const bgs = ["#ffebee", "#fff3e0", "#fffde7", "#e8f5e9", "#e8f5e9"];

            msgEl.innerText = messages[selectedRating - 1];
            msgEl.style.backgroundColor = bgs[selectedRating - 1];
            msgEl.style.color = colors[selectedRating - 1];
            msgEl.style.display = "block";
        }
    </script>
</body>
</html>
